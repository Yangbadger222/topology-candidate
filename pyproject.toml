[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overhead-ssl"
version = "0.1.0"
description = "Frozen foundation encoder baselines for overhead RGB imagery"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "networkx>=3.2",
  "scipy>=1.11",
  "shapely>=2.0",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "huggingface_hub>=0.34",
  "safetensors>=0.4",
  "transformers>=4.56,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
topology = ["streamlit>=1.36", "scikit-learn>=1.3", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
