experiment: M2A Frozen Dense Semantic Linear Probe
dataset: LoveDA
input_size: 448
seed_split: 20260901
seeds: [20260901, 20260902, 20260903]
probe_dev_fraction: 0.20
augmentation: none
optimizer: AdamW
learning_rate: 0.001
weight_decay: 0.0001
batch_size: 8
max_epochs: 30
early_stopping_patience: 5
selection_metric: probe_dev_mIoU
loss: class-weighted pixel-wise Cross Entropy
class_weighting: inverse_sqrt_frequency_from_probe_train_only
ignore_index: 255
native_ignore_label: 0
classes:
  1: background
  2: building
  3: road
  4: water
  5: barren
  6: forest
  7: agriculture
